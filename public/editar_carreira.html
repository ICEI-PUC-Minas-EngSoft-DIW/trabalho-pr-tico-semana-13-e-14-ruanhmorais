<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Item - CR7: A Lenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header class="main-header">
        <h1 class="logo">CR7: A Lenda</h1>
        <nav class="main-nav" id="main-nav"></nav>
    </header>

    <main class="container py-5">
        <h2 class="section-title text-center">Editar Item da Carreira</h2>

        <form id="editar-form" class="mx-auto" style="max-width: 700px;">
            
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control bg-dark text-white" id="titulo" required>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição Curta</label>
                <input type="text" class="form-control bg-dark text-white" id="descricao" required>
            </div>

            <div class="mb-3">
                <label for="imagem" class="form-label">URL da Imagem</label>
                <input type="text" class="form-control bg-dark text-white" id="imagem" required>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoria</label>
                <input type="text" class="form-control bg-dark text-white" id="categoria" required>
            </div>
            
            <div class="mb-3">
                <label for="periodo" class="form-label">Período</label>
                <input type="text" class="form-control bg-dark text-white" id="periodo" required>
            </div>

            <div class="mb-3">
                <label for="titulos" class="form-label">Títulos Principais</label>
                <input type="text" class="form-control bg-dark text-white" id="titulos">
            </div>

            <div class="mb-3">
                <label for="gols" class="form-label">Gols</label>
                <input type="text" class="form-control bg-dark text-white" id="gols">
            </div>

            <div class="mb-3">
                <label for="conteudo" class="form-label">Conteúdo Completo (Descrição Longa)</label>
                <textarea class="form-control bg-dark text-white" id="conteudo" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Salvar Alterações</button>
            <a href="index.html" class="btn btn-secondary btn-lg w-100 mt-2">Cancelar</a>

        </form>
    </main>

    <footer class="main-footer">
        <p>Desenvolvido por Ruan Morais - 2025</p>
        <p>
            <a href="#">GitHub</a> | <a href="#">LinkedIn</a>
        </p>
        <p>&copy; 2025 CR7: A Lenda. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
