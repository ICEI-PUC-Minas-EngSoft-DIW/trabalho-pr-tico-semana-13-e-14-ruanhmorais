<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR7: A Lenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header class="main-header">
        <h1 class="logo">CR7: A Lenda</h1>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#carreira">Carreira</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="slider-section container-fluid p-0">
            <div id="carouselDestaques" class="carousel slide" data-bs-ride="carousel">
                
                <div class="carousel-indicators" id="carousel-indicators">
                </div>

                <div class="carousel-inner" id="carousel-inner">
                    </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselDestaques" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselDestaques" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>


        <section id="carreira" class="career-section container text-center py-5">

    <div class="mb-4">
        <a href="cadastro_carreira.html" class="btn btn-warning btn-lg fw-bold">
            + Adicionar Novo Item na Carreira
        </a>
    </div>
    <h2 class="section-title">Fases da Carreira</h2>
    <div id="cards-clubes" class="row g-4 justify-content-center">
        </div>
            </section>

        <section id="recordes" class="career-section container text-center py-5" style="background-color: #1a1a1a;">
            <h2 class="section-title">Recordes e Conquistas</h2>
            <div id="cards-recordes" class="row g-4 justify-content-center">
                </div>
        </section>

        <section id="contato" class="form-section">
            <h2 class="section-title">Receba as últimas notícias do CR7!</h2>
            <form class="newsletter-form">
                <div class="form-group">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" name="name" placeholder="Digite seu nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>
                <button type="submit" class="submit-button">Inscrever</button>
            </form>
        </section>

    </main>

    <footer class="main-footer">
        <p>Desenvolvido por Ruan Morais - 2025</p>
        <p>
            <a href="#">GitHub</a> | <a href="#">LinkedIn</a>
        </p>
        <p>&copy; 2025 CR7: A Lenda. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
